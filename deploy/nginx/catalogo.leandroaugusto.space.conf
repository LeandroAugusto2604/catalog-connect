# /etc/nginx/sites-available/catalogo.leandroaugusto.space
# ln -s /etc/nginx/sites-available/catalogo.leandroaugusto.space /etc/nginx/sites-enabled/
# nginx -t && systemctl reload nginx

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name catalogo.leandroaugusto.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy reverso para o container na porta 3000
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name catalogo.leandroaugusto.space;

    ssl_certificate     /etc/letsencrypt/live/catalogo.leandroaugusto.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/catalogo.leandroaugusto.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 20m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}